version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_voice_detector_backend
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/detections.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_voice_detector_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
